name: Weekly data refresh

# 매주 월요일 03:00(KST) = 일요일 18:00(UTC). 공공데이터·OSM을 새로 받아 지식 DB와 지도 데이터를 다시 만든다.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Keep previous web data for comparison
        run: cp site/data/places.geojson /tmp/places.old.geojson

      - name: Fetch latest data and rebuild knowledge graph
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pipeline.run --refresh | tee /tmp/run.log

      - name: Run tests
        run: python -m pytest tests/pipeline -q

      - name: Commit if data changed
        id: commit
        run: |
          if python -m pipeline.changed /tmp/places.old.geojson site/data/places.geojson; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kg/dongtan-data.ttl site/data/places.geojson
            git commit -m "data: weekly refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "### 데이터가 바뀌어 다시 배포합니다"; echo '```'; grep -E "^\[(파일|공공|OSM|웹)\]" /tmp/run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### 바뀐 데이터가 없어 배포하지 않습니다" >> "$GITHUB_STEP_SUMMARY"
          fi

      # GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않으므로 배포를 직접 실행한다
      - name: Trigger deploys
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run cloudflare.yml --ref main
