<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>동탄 걷기·운동 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="지도"></div>

  <nav id="chips" aria-label="분류 선택">
    <select id="radius" class="radius" aria-label="조회 반경" title="조회 반경">
      <option value="1">1km</option>
      <option value="2">2km</option>
      <option value="3">3km</option>
      <option value="4">4km</option>
      <option value="5">5km</option>
      <option value="6">6km</option>
      <option value="7">7km</option>
      <option value="8">8km</option>
      <option value="9">9km</option>
      <option value="10">10km</option>
    </select>
    <button class="chip on" data-cat="all" aria-label="전체" title="전체">전체</button>
    <button class="chip" data-cat="walk" aria-label="산책로" title="산책로">🚶</button>
    <button class="chip" data-cat="run" aria-label="런닝코스" title="런닝코스">🏃</button>
    <button class="chip" data-cat="bike" aria-label="자전거도로" title="자전거도로">🚲</button>
    <button class="chip" data-cat="hike" aria-label="등산로" title="등산로">⛰️</button>
    <button class="chip" data-cat="exercise" aria-label="운동시설" title="운동시설">💪</button>
    <button class="chip" data-cat="rest" aria-label="휴게시설" title="휴게시설">🪑</button>
    <button class="chip" data-cat="park" aria-label="공원" title="공원">🌳</button>
    <button class="chip" data-cat="toilet" aria-label="화장실" title="화장실">🚻</button>
    <button class="chip" data-cat="conv" aria-label="편의점" title="편의점">🏪</button>
  </nav>

  <button id="locate" class="fab" aria-label="내 위치로" title="내 위치로" hidden>◎</button>
  <button id="measure-btn" class="fab" aria-label="거리 재기" title="거리 재기(출발·경유·도착)">📏</button>
  <button id="memo-btn" class="fab" aria-label="메모" title="메모(암호 key 필요)">📝</button>
  <button id="home" class="fab" aria-label="지도 중심으로" title="지도 중심(청계동 552)으로">🏁</button>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <section id="sheet" class="peek" aria-label="장소 목록">
    <div id="grip" role="button" tabindex="0" aria-label="목록 펼치기/접기"><span></span></div>
    <div id="sheet-head">
      <strong id="list-title">중심에서 가까운 순</strong>
      <span id="list-count"></span>
    </div>
    <ul id="list"></ul>
    <div id="detail" hidden></div>
    <div id="tool" hidden></div>
    <footer id="credits">
      지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> ·
      데이터: 공공데이터포털 표준데이터, OpenStreetMap(ODbL) · <span id="built"></span>
    </footer>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
